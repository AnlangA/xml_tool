name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Nightly fuzz window: 03:20 UTC.
    - cron: "20 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025
          - os: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --quiet --all-targets

      - name: Release build
        run: cargo build --release --quiet

      - name: Benchmark smoke + JSON results
        if: runner.os == 'Linux'
        run: cargo bench --no-run --quiet

      - name: Upload benchmark binaries metadata
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bench-binaries
          path: target/release/deps/xml_benchmark-*
          if-no-files-found: ignore

  security:
    name: audit-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  fuzz:
    name: nightly-fuzz
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Corpus regression (30-minute budget)
        run: |
          # The in-tree robustness suite (tests/property_fuzz_tests.rs)
          # covers XML bytes, EXI streams, XPath, schemas, and base64
          # entry points; the nightly job additionally drives cargo-fuzz
          # when fuzz targets are present.
          if [ -d fuzz ]; then
            cargo fuzz run fuzz_xml -- -max_total_time=1800
          else
            cargo test --release --test property_fuzz_tests -- --nocapture
          fi
