[package]
name = "xml_tool"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["XML Tool Contributors"]
description = "A modern, high-performance XML/EXI viewer and editor"
license = "MIT"
keywords = ["xml", "exi", "viewer", "editor", "gui"]
categories = ["gui", "parsing", "visualization"]

[dependencies]
# XML engine: arena DOM, namespaces, XPath, XSD, source ranges, PullParser
uppsala = "=0.9.0"

# EXI (Efficient XML Interchange) encoding/decoding
erxi = { git = "https://github.com/schachmadinejad/erxi", default-features = false }

# GUI framework
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["image"] }

# Base64 image previews
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

# File dialog
rfd = "0.15"

# Theme
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }

# Performance optimization
parking_lot = "0.12"
lru = "0.18"

# Icons (icon-name constants only; font loading is ours)
egui-phosphor = "=0.11.0"

# Runtime localization (Fluent)
fluent-bundle = "0.16.0"
unic-langid = "0.9"
sys-locale = "0.3"

# Export formats
serde_json = "1.0"

# Utilities
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# External file-change monitoring
notify = "8.2.0"

# Rope-based source buffers (clones share the underlying tree)
ropey = "1.6.1"

# Sequence diff for structural XML comparison
similar = "=3.1.1"

# SHA-256 digests for EXI reports
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.27"
egui_kittest = { version = "0.33.3", features = ["snapshot", "wgpu"] }

[profile.release]
opt-level = 3
lto = true

[[bench]]
name = "xml_benchmark"
harness = false
